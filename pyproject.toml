[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bobo"
version = "1.0.0"
description = "Chatbot idiota de terminal, em Python puro, com memória, humor duvidoso e reflexões estilo ELIZA em português."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment",
]

[project.scripts]
bobo = "bobo.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bobo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
